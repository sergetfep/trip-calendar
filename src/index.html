<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trip Calendar</title>
  </head>
  <body>
    <main class="page">
      <h1 class="title">Trip Calendar</h1>

      <section class="card">
        <div class="row">
          <label class="check">
            <input id="roundtrip" type="checkbox" checked />
            <span>Туда-обратно</span>
          </label>
        </div>

        <div class="row inputs">
          <label class="field">
            <span class="field__label">Туда</span>
            <input
              id="depart"
              class="field__input"
              type="text"
              placeholder="ДД.ММ.ГГГГ"
              readonly
            />
          </label>

          <label class="field" id="return-field">
            <span class="field__label">Обратно</span>
            <input
              id="return"
              class="field__input"
              type="text"
              placeholder="ДД.ММ.ГГГГ"
              readonly
            />
          </label>
        </div>

        <div id="calendar" class="calendar" aria-hidden="true"></div>
      </section>
    </main>
  </body>
</html>
